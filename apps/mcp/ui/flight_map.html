<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight</title>
<!--
  The flight map card, an MCP App view (apps/mcp/resources.py). It runs in
  the client's sandboxed frame, so it carries its own style, script and base
  map (flight_land.js); it loads nothing over the network. Its scripts
  are the site's own static/js/flight_map.js and flight_land.js (the share
  page draws the same card), and flight_share.js for the Share button. The host's style
  variables win over the fallbacks here.
-->
<style>
  :root {
    color-scheme: light dark;
    font-family: var(--font-sans, system-ui, sans-serif);
    color: var(--color-text-primary, CanvasText);
    background: transparent;
    --muted: var(--color-text-secondary, GrayText);
    --rule: var(--color-border-secondary, color-mix(in srgb, currentColor 15%, transparent));
    --sea: color-mix(in srgb, currentColor 4%, transparent);
    --land: color-mix(in srgb, currentColor 11%, transparent);
    --space: color-mix(in srgb, currentColor 7%, transparent);
    --accent: var(--color-text-info, #2f6fde);
  }
  body { margin: 0; padding: 12px 16px 16px; }
  [hidden] { display: none !important; }
  .map { display: block; width: 100%; height: auto; border-radius: 10px; background: var(--sea); }
  .map .flight-map__land { fill: var(--land); stroke: none; }
  .map.flight-map--globe { background: var(--space); }
  .map .flight-map__sphere { fill: Canvas; stroke: var(--rule); }
  .map .flight-map__graticule { fill: none; stroke: var(--rule); stroke-width: 0.6; }
  .map .flight-map__globe-land { fill-rule: evenodd; }
  .map .flight-map__ahead { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 5; }
  .map .flight-map__flown { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; }
  .map .flight-map__airport { fill: Canvas; stroke: var(--muted); stroke-width: 1.5; }
  .map .flight-map__halo { fill: var(--accent); opacity: 0.2; }
  .map .flight-map__plane { fill: var(--accent); }
  .map .flight-map__code { fill: var(--muted); font-size: 12px; text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: Canvas; stroke-width: 3px; }
  .summary { margin: 0 0 10px; font-size: var(--font-text-md-size, 1rem); line-height: 1.4; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; }
  .route { margin: 0; font-size: 1.125rem; font-weight: var(--font-weight-semibold, 600); }
  .pill { padding: 2px 10px; border: 1px solid currentColor; border-radius: 999px; font-size: var(--font-text-sm-size, 0.875rem); }
  .pill[data-tone="muted"] { color: var(--muted); }
  .pill[data-tone="ok"] { color: var(--accent); }
  .bar { height: 6px; margin-top: 12px; border-radius: 3px; background: var(--rule); overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--accent); }
  .times { display: flex; justify-content: space-between; margin: 8px 0 0; font-size: var(--font-text-sm-size, 0.875rem); color: var(--muted); }
  .times strong { color: var(--color-text-primary, CanvasText); }
  .times > * { display: flex; flex-direction: column; gap: 2px; font-variant-numeric: tabular-nums; }
  .times > :last-child { align-items: flex-end; text-align: right; }
  .times .flight-card__local { white-space: nowrap; }
  .times .flight-card__yours { color: var(--muted); font-weight: var(--font-weight-normal, 400); white-space: nowrap; }
  .note, .status { margin: 10px 0 0; font-size: var(--font-text-sm-size, 0.875rem); color: var(--muted); }
  .share { margin-top: 12px; }
  .share button { padding: 6px 14px; border: 1px solid var(--accent); border-radius: 999px; background: transparent; color: var(--accent); font: inherit; font-size: var(--font-text-sm-size, 0.875rem); cursor: pointer; }
  .share button:disabled { opacity: 0.6; cursor: progress; }
  .share-link { display: flex; gap: 8px; margin: 0; }
  .share-link input { flex: 1; min-width: 0; padding: 6px 10px; border: 1px solid var(--rule); border-radius: 8px; background: transparent; color: inherit; font: inherit; font-size: var(--font-text-sm-size, 0.875rem); }
</style>
</head>
<body>
<p class="status" data-status>Loading…</p>
<article data-card hidden>
  <p class="summary" data-summary></p>
  <svg class="map" data-map viewBox="0 0 640 360" role="img" aria-label="Map of the flight's route"></svg>
  <div class="row">
    <p class="route" data-route></p>
    <span class="pill" data-pill></span>
  </div>
  <div class="bar"><span data-progress></span></div>
  <p class="times"><span data-departed></span><strong data-arrives></strong></p>
  <p class="note" data-note hidden></p>
  <div class="share" data-share-box hidden>
    <button type="button" data-share-button>Share a live link</button>
    <p class="share-link" data-share-link hidden>
      <input type="text" readonly aria-label="Live link to this flight" data-share-url>
      <button type="button" data-share-copy>Copy</button>
    </p>
    <p class="note" data-share-note hidden></p>
  </div>
</article>
</body>
</html>
